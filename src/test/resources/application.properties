spring.datasource.url=${JDBC_DATABASE_URL:${TEST_SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/testhospitaldb}}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${JDBC_DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:hospital}}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:hospital}}

# see migration congruency in tests
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

security.jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZmdoaWprbG1ub3BxcnN0dXZ3eHl6QUJDREVGR0hJSktMTU5PUFFSU1RVVldYWVowMTIzNDU2Nzg5}
security.jwt.expiration-ms=86400000
security.jwt.issuer=${JWT_ISSUER:evergreen-general-hospital-api}
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Keep the OAuth client registration available for security-context tests.
spring.security.oauth2.client.registration.google.client-id=test-google-client
spring.security.oauth2.client.registration.google.client-secret=test-google-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}


