spring.datasource.url=${TEST_SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/testhospitaldb}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:hospital}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:hospital}

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=86400000
security.jwt.issuer=${JWT_ISSUER:demo-api}
