spring.application.name=evergreen-general-hospital
spring.datasource.url=${JDBC_DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hospitaldb}}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${JDBC_DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:hospital}}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:hospital}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=86400000
security.jwt.issuer=${JWT_ISSUER:evergreen-general-hospital-api}

cors.allowed-origins=${CORS_ORIGINS}

# Google OAuth2 client registration. Keep credentials in environment variables.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ===============================================
# Hospital Domain Configuration
# ===============================================
hospital.scheduling.default-shift-start=09:00
hospital.scheduling.default-shift-end=17:00
hospital.scheduling.default-slot-duration=15m
