spring.application.name=demo
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hospitaldb}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:hospital}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:hospital}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT validation for a separate frontend. Point this at your IdP issuer, e.g. Keycloak/Auth0.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:https://accounts.google.com}

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=86400000
