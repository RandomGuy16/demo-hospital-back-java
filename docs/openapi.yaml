openapi: 3.1.0
info:
  title: Evergreen General Hospital API
  version: 0.1.0
  description: >
    A REST API for managing hospital resources: patients, practitioners,
    departments, appointments, and medical records.
  contact:
    name: API Support
    email: support@example.org
servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Patients
  - name: Practitioners
  - name: Departments
  - name: Appointments
  - name: MedicalRecords
  - name: Authentication

paths:
  /api/v1/patients:
    get:
      tags: [Patients]
      summary: List patients
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: size
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
        - in: query
          name: sort
          schema: { type: string, example: "lastName,asc" }
        - in: query
          name: mrn
          description: Filter by medical record number
          schema: { type: string }
      responses:
        '200':
          description: Page of patients
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagePatient'
    post:
      tags: [Patients]
      summary: Create patient
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatientCreateRequest' }
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: URL of the created resource
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Patient' }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/patients/{id}:
    get:
      tags: [Patients]
      summary: Get patient by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Patient
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Patient' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    put:
      tags: [Patients]
      summary: Replace patient
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatientUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Patient' }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      tags: [Patients]
      summary: Delete patient
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/register:
    post:
      tags: [Authentication]
      summary: Register a patient account
      description: >
        Self-service registration for patients. Demographics resolve or create the
        patient by national idNumber (anti-hijacking verified), and the account is
        linked to it with the ROLE_PATIENT role.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserAccountRegisterRequest' }
      responses:
        '201':
          description: Registered, returns a signed JWT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Email taken, idNumber already owns an account, or identity mismatch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/login:
    post:
      tags: [Authentication]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserAccountLoginRequest' }
      responses:
        '200':
          description: Logged in, returns a signed JWT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/me:
    get:
      tags: [Authentication]
      summary: Get the authenticated user's claims
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user claims
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUserResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/appointments/guest:
    post:
      tags: [Appointments]
      summary: Book a guest appointment
      description: >
        Books an appointment for an unregistered person identified by national
        idNumber. The patient shell is created if it does not exist yet.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuestAppointmentRequest' }
      responses:
        '201':
          description: Appointment created
          headers:
            Location:
              description: URL of the created resource
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '404':
          description: Practitioner or department not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PagePatient:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Patient' }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
      required: [items, page, size, total]

    Patient:
      type: object
      properties:
        id: { type: string, format: uuid }
        mrn: { type: string, description: Medical Record Number }
        firstName: { type: string }
        lastName: { type: string }
        dateOfBirth: { type: string, format: date }
        gender: { type: string, enum: [male, female, other, unknown] }
        phone: { type: string }
        email: { type: string, format: email }
        address: { $ref: '#/components/schemas/Address' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, mrn, firstName, lastName, dateOfBirth]

    PatientCreateRequest:
      type: object
      properties:
        mrn: { type: string, minLength: 1 }
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
        dateOfBirth: { type: string, format: date }
        gender: { type: string, enum: [male, female, other, unknown] }
        phone: { type: string }
        email: { type: string, format: email }
        address: { $ref: '#/components/schemas/Address' }
      required: [mrn, firstName, lastName, dateOfBirth]

    PatientUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/PatientCreateRequest'

    Address:
      type: object
      properties:
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        state: { type: string }
        postalCode: { type: string }
        country: { type: string }

    ErrorResponse:
      type: object
      properties:
        code: { type: string, example: "validation_error" }
        message: { type: string }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
        traceId: { type: string }
      required: [code, message]

    UserAccountRegisterRequest:
      type: object
      properties:
        firstName: { type: string, maxLength: 50 }
        lastName: { type: string, maxLength: 50 }
        idNumber: { type: string, pattern: '^[0-9]{10}$' }
        dateOfBirth: { type: string, format: date }
        gender: { type: string, maxLength: 20 }
        phoneNumber: { type: string, minLength: 6, maxLength: 20 }
        emergencyContact: { type: string, maxLength: 200 }
        address: { type: string, maxLength: 200 }
        email: { type: string, format: email }
        password: { type: string, minLength: 6, maxLength: 100 }
      required: [firstName, lastName, idNumber, dateOfBirth, gender, phoneNumber, address, email, password]

    UserAccountLoginRequest:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string }
      required: [email, password]

    AuthResponse:
      type: object
      properties:
        token: { type: string, description: Signed JWT for the authenticated user }
      required: [token]

    CurrentUserResponse:
      type: object
      properties:
        subject: { type: string }
        issuer: { type: string, nullable: true }
        email: { type: string }
        name: { type: string }
        preferredUsername: { type: string }
        authorities:
          type: array
          items: { type: string }
      required: [subject, email, name, preferredUsername, authorities]

    GuestAppointmentRequest:
      type: object
      properties:
        idNumber: { type: string, description: National idNumber identifying the guest }
        phoneNumber: { type: string }
        email: { type: string, format: email }
        location: { type: string }
        practitionerId: { type: string, format: uuid }
        departmentId: { type: string, format: uuid }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        status:
          type: string
          enum: [SCHEDULED, COMPLETED, CANCELLED]
      required: [idNumber, phoneNumber, email, location, practitionerId, departmentId, start, end, status]

    Appointment:
      type: object
      properties:
        appointmentId: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        practitionerId: { type: string, format: uuid }
        departmentId: { type: string, format: uuid }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        status:
          type: string
          enum: [SCHEDULED, COMPLETED, CANCELLED]
      required: [appointmentId, patientId, practitionerId, departmentId, start, end, status]
